<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Certificate - Arkatanu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- This page is two folders deep (assets/excel/), so the stylesheet is two levels up (I am writing this so that my brain won't make any silly mistakes) -->
    <link rel="stylesheet" href="../../style.css" />
</head>
<body>
    
    <main class="cert-page">
        <h1 class="section-title cert-title">Excel</h1>

        <!-- Thumbnail: clicking it jumps to the #full view below (no Javascript needed) -->
        <a class="cert-thumb" href="#full">
            <img src="certificate.png" alt="Excel certificate" />
            <span class="cert-thumb-hint">Click to view full size</span>
        </a>

        <a class="btn back-link" href="../../index.html#skills">Back to portfolio</a>
    </main>

    <!-- Full view: hidden until the thumbnail is clicked. Click anywhere to close. -->
    <a class="lightbox" id="full" href="#" aria-label="Close full view">
        <img src="certificate.png" alt="Excel certificate, full view" />
        <span class="lightbox-close">Close</span>
    </a>
    
</body>
</html>
